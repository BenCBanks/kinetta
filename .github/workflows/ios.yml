# Builds the iPhone app (mobile/) on a Mac runner, to prove it still builds after every change to it or to the phone
# pages it carries (app/static): an unsigned Simulator build, kept for 7 days as a download.
# On main (and when started by hand) the "testflight" job then signs the app and uploads it to App Store Connect, where
# it appears in TestFlight. It needs four repository secrets (docs/ios.md, steps 5-7); until they exist it does nothing.
name: iPhone app
on:
  pull_request:
    paths: ["mobile/**", "app/static/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "app/static/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple API helper and bundled app icon
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # copies app/static into the app and writes the native project's plugin list
      - run: npm run sync
      - name: Test the durable Health queue
        run: |
          swiftc ios/App/App/HealthSyncState.swift tests/main.swift -o "$RUNNER_TEMP/health-state-tests"
          "$RUNNER_TEMP/health-state-tests"
      - name: Test Health food mapping and account state
        run: |
          swiftc ios/App/App/HealthFoodState.swift tests/healthfood/main.swift -o "$RUNNER_TEMP/health-food-tests"
          "$RUNNER_TEMP/health-food-tests"
      - name: Test food entry inbox
        run: |
          swiftc ios/App/App/FoodEntryState.swift tests/foodentry/main.swift -o "$RUNNER_TEMP/food-entry-tests"
          "$RUNNER_TEMP/food-entry-tests"
      - name: Test the durable activity recorder
        run: |
          swiftc ios/App/App/TrackRecordingState.swift tests/track/main.swift -o "$RUNNER_TEMP/track-state-tests"
          "$RUNNER_TEMP/track-state-tests"
      - name: Build for the iPhone Simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build for a real iPhone (unsigned, so it can't be installed; checks the release build compiles)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check the unsigned archive and HealthKit entitlements
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -archivePath "$RUNNER_TEMP/Kinetta-check.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          for framework in "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app/Frameworks/"*.framework; do
            [ -d "$framework" ] || continue
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app"
          codesign --display --entitlements - --xml \
            "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app" > "$RUNNER_TEMP/health-entitlements.plist"
          python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path
          entitlements = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'health-entitlements.plist').read_bytes())
          assert entitlements['aps-environment'] in ('development', 'production')
          assert entitlements['com.apple.developer.healthkit'] is True
          assert entitlements['com.apple.developer.healthkit.background-delivery'] is True
          PYCODE
      - name: Pack the Simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Kinetta-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Kinetta-simulator
          path: Kinetta-simulator.zip
          retention-days: 7

  testflight:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check the Apple keys are set up
        id: keys
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY_P8" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No TestFlight upload: the Apple secrets aren't set up yet (docs/ios.md, steps 5-7)."; fi
        working-directory: .
      - if: steps.keys.outputs.ok
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.keys.outputs.ok
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.keys.outputs.ok
        run: npm ci && npm run sync
      # Apple's own signing: with the App Store Connect key, Xcode makes and keeps the certificate and profile itself,
      # so no certificate files live in this repository or its secrets. Each upload needs a higher build number than the
      # last; the workflow's run number (+100, above any build made by hand) always goes up.
      - name: Check App Store Connect app access
        if: steps.keys.outputs.ok
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 scripts/check-app-store.py
      - name: Archive for App Store export
        if: steps.keys.outputs.ok
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kinetta.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 100)) archive
          # Archiving with automatic development signing requires a registered device.
          # Defer Apple distribution signing to export; retain the app's HealthKit
          # entitlements in a temporary ad-hoc signature for Xcode to carry forward.
          for framework in "$RUNNER_TEMP/Kinetta.xcarchive/Products/Applications/App.app/Frameworks/"*.framework; do
            [ -d "$framework" ] || continue
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/Kinetta.xcarchive/Products/Applications/App.app"
      - name: Sign and export for App Store Connect
        if: steps.keys.outputs.ok
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kinetta.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Verify signed app and icon before upload
        if: steps.keys.outputs.ok
        run: python3 scripts/check-export.py
      - name: Upload signed app to TestFlight
        if: steps.keys.outputs.ok
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          ipa=("$RUNNER_TEMP/export/"*.ipa)
          [ "${#ipa[@]}" -eq 1 ] && [ -f "${ipa[0]}" ]
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app \
            --type ios --file "${ipa[0]}" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "::notice::Build $((GITHUB_RUN_NUMBER + 100)) uploaded. It shows up in TestFlight after Apple's processing (usually 10-30 minutes)."
      - name: Remove the key
        if: always() && steps.keys.outputs.ok
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
    outputs:
      uploaded: ${{ steps.keys.outputs.ok }}

  # After the upload, send the build to the TestFlight groups (repository variable TESTFLIGHT_GROUPS, default "Beta")
  # so testers get it without anyone picking it in App Store Connect. External groups need Apple's beta review, which
  # this submits; Apple releases the build to testers itself once it is approved. Waiting for Apple's processing takes
  # up to an hour, so this runs on a Linux runner rather than holding the Mac.
  beta:
    needs: testflight
    if: needs.testflight.outputs.uploaded == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
      WHAT_TO_TEST: ${{ github.event.head_commit.message }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Send the build to TestFlight testers
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) python3 scripts/distribute-beta.py
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
