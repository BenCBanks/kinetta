# Builds the iPhone app (mobile/) on a Mac runner, to prove it still builds after every change to it or to the phone
# pages it carries (app/static). No signing yet, so nothing goes to Apple: the result is a Simulator build, kept for
# 7 days as a download. Signing and TestFlight come later; what's needed for them is in docs/ios.md.
name: iPhone app
on:
  pull_request:
    paths: ["mobile/**", "app/static/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "app/static/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # copies app/static into the app and writes the native project's plugin list
      - run: npm run sync
      - name: Build for the iPhone Simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build for a real iPhone (unsigned, so it can't be installed; checks the release build compiles)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Pack the Simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Kinetta-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Kinetta-simulator
          path: Kinetta-simulator.zip
          retention-days: 7
