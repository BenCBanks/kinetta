# Builds the iPhone app (mobile/) on a Mac runner, to prove it still builds after every change to it or to the phone
# pages it carries (app/static): an unsigned Simulator build, kept for 7 days as a download.
# Testers get a new build twice a week, not on every merge (owner, 2026-10-26: each build emails every tester). Merges only
# prove the app still builds. Monday and Thursday mornings the scheduled run signs, uploads and sends a build to testers,
# but only if the app changed since the last release; "Run workflow" (Actions > iPhone app) releases one at once.
# Signing needs four repository secrets (docs/ios.md, steps 5-7); until they exist it does nothing.
name: iPhone app
on:
  pull_request:
    paths: ["mobile/**", "app/static/**", "dev/tests/native-ui/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "app/static/**", "dev/tests/native-ui/**", ".github/workflows/ios.yml"]
  schedule:
    - cron: "0 14 * * 1,4"      # Monday and Thursday, 9-10 am US Eastern
  workflow_dispatch:
permissions:
  contents: read
concurrency:          # a merge never cancels a tester release that's under way
  group: ios-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || 'check' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
jobs:
  # Is there anything new for testers? A scheduled run with no app changes since the last release stops here, so no
  # Mac time is spent and nobody gets an email. Also writes "What to Test" from the changes since that release.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      since: ${{ steps.check.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in schedule|workflow_dispatch) ;; *) echo "release=0" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          # the last release: the newest successful scheduled or hand-started run of this workflow on main
          since=$(gh run list --workflow ios.yml --branch main --status success --limit 100 --json headSha,event \
            -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].headSha // ""')
          echo "since=$since" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] && [ -n "$since" ] && git cat-file -e "$since^{commit}" 2>/dev/null \
             && git diff --quiet "$since" HEAD -- mobile app/static .github/workflows/ios.yml; then
            echo "::notice::No app changes since the last tester build ($since); nothing sent."
            echo "release=0" >> "$GITHUB_OUTPUT"
          else echo "release=1" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.release == '1'
    runs-on: macos-26-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple API helper and bundled app icon
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # copies app/static into the app and writes the native project's plugin list
      - run: npm run sync
      - name: Test the durable Health queue
        run: |
          swiftc ios/App/App/HealthSyncState.swift tests/main.swift -o "$RUNNER_TEMP/health-state-tests"
          "$RUNNER_TEMP/health-state-tests"
      - name: Test Health food mapping and account state
        run: |
          swiftc ios/App/App/HealthFoodState.swift tests/healthfood/main.swift -o "$RUNNER_TEMP/health-food-tests"
          "$RUNNER_TEMP/health-food-tests"
      - name: Test food entry inbox
        run: |
          swiftc ios/App/App/FoodEntryState.swift tests/foodentry/main.swift -o "$RUNNER_TEMP/food-entry-tests"
          "$RUNNER_TEMP/food-entry-tests"
      - name: Test native food-share account and durability state
        run: |
          swiftc ios/App/App/ShareFoodState.swift ios/App/App/ShareFoodStore.swift ios/App/App/ShareFoodKeychain.swift tests/sharefood/main.swift -o "$RUNNER_TEMP/share-food-tests"
          "$RUNNER_TEMP/share-food-tests"
      - name: Test the durable activity recorder
        run: |
          swiftc ios/App/App/TrackRecordingState.swift ios/App/App/IntervalState.swift tests/track/main.swift -o "$RUNNER_TEMP/track-state-tests"
          "$RUNNER_TEMP/track-state-tests"
      - name: Test native interval contracts (fictional data; no device alerts)
        working-directory: mobile
        run: |
          swiftc ios/App/App/TrackRecordingState.swift ios/App/App/IntervalState.swift tests/intervals/main.swift -o "$RUNNER_TEMP/interval-tests"
          "$RUNNER_TEMP/interval-tests" ../dev/tests/fixtures/interval_presets.json
      - name: Build for the iPhone Simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build for a real iPhone (unsigned, so it can't be installed; checks the release build compiles)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check the unsigned archive and HealthKit entitlements
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -archivePath "$RUNNER_TEMP/Kinetta-check.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          for framework in "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app/Frameworks/"*.framework; do
            [ -d "$framework" ] || continue
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app"
          codesign --display --entitlements - --xml \
            "$RUNNER_TEMP/Kinetta-check.xcarchive/Products/Applications/App.app" > "$RUNNER_TEMP/health-entitlements.plist"
          python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path
          entitlements = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'health-entitlements.plist').read_bytes())
          assert entitlements['aps-environment'] in ('development', 'production')
          assert entitlements['com.apple.developer.healthkit'] is True
          assert entitlements['com.apple.developer.healthkit.background-delivery'] is True
          PYCODE
      - name: Pack the Simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Kinetta-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Kinetta-simulator
          path: Kinetta-simulator.zip
          retention-days: 7


  native-ui:
    needs: build
    # Native iOS Simulator execution uses Apple Silicon; Intel remains the compile/archive runner.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: Kinetta-simulator
          path: ${{ runner.temp }}/simulator
      - name: Unpack the unsigned universal Simulator app
        run: unzip -q "$RUNNER_TEMP/simulator/Kinetta-simulator.zip" -d "$RUNNER_TEMP/simulator"
      - name: Check native WebView layout with fictional records
        timeout-minutes: 15
        run: python3 dev/tests/native-ui/run.py --app "$RUNNER_TEMP/simulator/App.app" --output "$RUNNER_TEMP/native-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-fictional-evidence
          path: |
            ${{ runner.temp }}/native-ui/*.png
            ${{ runner.temp }}/native-ui/*.json
          retention-days: 7

  testflight:
    needs: [changes, build, native-ui]
    if: needs.changes.outputs.release == '1' && github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check the Apple keys are set up
        id: keys
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY_P8" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No TestFlight upload: the Apple secrets aren't set up yet (docs/ios.md, steps 5-7)."; fi
        working-directory: .
      - if: steps.keys.outputs.ok
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.keys.outputs.ok
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.keys.outputs.ok
        run: npm ci && npm run sync
      # Apple's own signing: with the App Store Connect key, Xcode makes and keeps the certificate and profile itself,
      # so no certificate files live in this repository or its secrets. Each upload needs a higher build number than the
      # last; the workflow's run number (+100, above any build made by hand) always goes up.
      - name: Check App Store Connect app access
        if: steps.keys.outputs.ok
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 scripts/check-app-store.py
      - name: Archive for App Store export
        if: steps.keys.outputs.ok
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kinetta.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 100)) archive
          # Archiving with automatic development signing requires a registered device.
          # Defer Apple distribution signing to export; retain the app's HealthKit
          # entitlements in a temporary ad-hoc signature for Xcode to carry forward.
          for framework in "$RUNNER_TEMP/Kinetta.xcarchive/Products/Applications/App.app/Frameworks/"*.framework; do
            [ -d "$framework" ] || continue
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/Kinetta.xcarchive/Products/Applications/App.app"
      - name: Sign and export for App Store Connect
        if: steps.keys.outputs.ok
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kinetta.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Verify signed app and icon before upload
        if: steps.keys.outputs.ok
        run: python3 scripts/check-export.py
      - name: Upload signed app to TestFlight
        if: steps.keys.outputs.ok
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          ipa=("$RUNNER_TEMP/export/"*.ipa)
          [ "${#ipa[@]}" -eq 1 ] && [ -f "${ipa[0]}" ]
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app \
            --type ios --file "${ipa[0]}" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "::notice::Build $((GITHUB_RUN_NUMBER + 100)) uploaded. It shows up in TestFlight after Apple's processing (usually 10-30 minutes)."
      - name: Remove the key
        if: always() && steps.keys.outputs.ok
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
    outputs:
      uploaded: ${{ steps.keys.outputs.ok }}

  # After the upload, send the build to the TestFlight groups (repository variable TESTFLIGHT_GROUPS, default "Beta")
  # so testers get it without anyone picking it in App Store Connect. External groups need Apple's beta review, which
  # this submits; Apple releases the build to testers itself once it is approved. Waiting for Apple's processing takes
  # up to an hour, so this runs on a Linux runner rather than holding the Mac.
  beta:
    needs: [changes, testflight]
    if: needs.testflight.outputs.uploaded == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
      SINCE: ${{ needs.changes.outputs.since }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # "What to Test": one line per app change since the last tester build (merge titles), newest first
      - name: List what changed since the last tester build
        run: |
          range=HEAD~20..HEAD
          if [ -n "$SINCE" ] && git cat-file -e "$SINCE^{commit}" 2>/dev/null; then range="$SINCE..HEAD"; fi
          { echo 'WHAT_TO_TEST<<END_OF_NOTES'
            git log --no-merges --format='%s' "$range" -- ../mobile ../app/static | grep -v '\[skip ci\]' | head -25
            echo 'END_OF_NOTES'; } >> "$GITHUB_ENV"
      - name: Send the build to TestFlight testers
        run: |
          umask 077
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) python3 scripts/distribute-beta.py
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
