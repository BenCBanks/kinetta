# Kinetta's test suite on every pull request that touches the app: a throwaway copy with the made-up demo data, then
# dev/tests/run.sh (syntax, the API tests, and the AI + push tests inside the container with stand-ins - nothing is
# sent anywhere: the AI key is a placeholder).
name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a throwaway Kinetta
        run: |
          GEMINI_API_KEY=placeholder-for-tests KINETTA_PORT=8798 TZ=America/New_York docker compose -p kinettatest up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8798/api/health && break; sleep 3; done
      - name: Load the demo data
        env:
          KINETTA_URL: http://localhost:8798
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
      - name: Syntax, unit and quick API checks
        run: dev/tests/run.sh --quick
      - name: Server log (if something failed)
        if: failure()
        run: docker compose -p kinettatest logs app | tail -100
      - name: Stop it
        if: always()
        run: docker compose -p kinettatest down -v
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AI evaluation contracts (no paid model calls)
        run: python3 dev/evals/check.py
      - name: Start a throwaway Kinetta
        run: |
          GEMINI_API_KEY=placeholder-for-tests KINETTA_PORT=8798 TZ=America/New_York docker compose -p kinettatest up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8798/api/health && break; sleep 3; done
      - name: Load the demo data
        env:
          KINETTA_URL: http://localhost:8798
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
      - name: Run the tests
        run: dev/tests/run.sh
      - name: Check interval voice settings in a browser (fictional accounts)
        run: |
          npm install --prefix /tmp/interval-browser playwright
          /tmp/interval-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/interval-browser/node_modules node dev/tests/interval_voice_ui.cjs

      - name: Check automatic asset updates and offline cache
        run: NODE_PATH=/tmp/interval-browser/node_modules node dev/tests/asset_cache_ui.cjs

      - name: Check the compact Explore guide (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          python3 dev/tests/explore_fixture.py
          NODE_PATH=/tmp/interval-browser/node_modules node dev/tests/guide_ui.cjs

      - name: Check Progress navigation in a browser (fictional accounts)
        run: |
          npm install --prefix /tmp/progress-browser playwright
          /tmp/progress-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/progress-browser/node_modules node dev/tests/progress_ui.cjs

      - name: Check Fitness prediction layout and provenance (fictional accounts)
        run: KINETTA_PROJECT=kinettatest NODE_PATH=/tmp/progress-browser/node_modules node dev/tests/fitness_ui.cjs

      - name: Check full-width personal Heatmap (fictional accounts and tiles)
        run: KINETTA_PROJECT=kinettatest NODE_PATH=/tmp/progress-browser/node_modules node dev/tests/heatmap_ui.cjs

      - name: Check profile cards and the inline editor in a browser (fictional accounts)
        run: |
          npm install --prefix /tmp/card-browser playwright
          /tmp/card-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/profile_card_ui.cjs
      - name: Check Nutrition navigation and logging in a browser (fictional accounts)
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/nutrition_ui.cjs
      - name: Check Track launch controls and map gestures (fictional accounts)
        run: |
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/track_home_ui.cjs
          KINETTA_PROJECT=kinettatest NODE_PATH=/tmp/card-browser/node_modules node dev/tests/top_chips_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/track_ready_map_ui.cjs
      - name: Check Activity social tools and card reuse (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/activity_home_ui.cjs
      - name: Check compact food entry and amount controls (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/food_entry_ui.cjs
      - name: Check compact training plans and Track preparation (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/plan_ui.cjs
      - name: Check Activity detail layout and permissions (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/activity_detail_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/notification_edit_ui.cjs
      - name: Check compact lifting logger and exercise history (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/lift_compact_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/lift_ui.cjs
      - name: Check compact recipes, foods and ingredient editor (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/recipes_compact_ui.cjs
      - name: Check Friends and named Back links with touch maps (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/friends_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/back_navigation_ui.cjs
      - name: Check notification switches and pending saves (fictional preferences)
        env:
          KINETTA_URL: http://localhost:8798
        run: |
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/personal_notifications_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/notification_settings_ui.cjs
      - name: Check progress share pictures and controls (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/recaps_ui.cjs
      - name: Check food Insights and goals in a browser (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          python3 dev/tests/insights_fixture.py
          NODE_PATH=/tmp/interval-browser/node_modules node dev/tests/insights_ui.cjs
          NODE_PATH=/tmp/interval-browser/node_modules node dev/tests/goals_ui.cjs

      - name: Check one-tap reaction choices on every activity list (fictional accounts)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
        run: |
          python3 dev/tests/inline_reactions_fixture.py
          PHASE=after NODE_PATH=/tmp/card-browser/node_modules node dev/tests/inline_reactions_ui.cjs
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/inline_reactions_actions.cjs
      - name: Check shared password visibility in app and admin forms (fictional values)
        env:
          KINETTA_URL: http://localhost:8798
        run: NODE_PATH=/tmp/card-browser/node_modules node dev/tests/password_visibility_ui.cjs

      - name: Server log (if something failed)
        if: failure()
        run: docker compose -p kinettatest logs app | tail -100
      - name: Stop it
        if: always()
        run: docker compose -p kinettatest down -v
