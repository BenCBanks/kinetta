# Kinetta's test suite on every pull request that touches the app: a throwaway copy with the made-up demo data, then
# dev/tests/run.sh (syntax, the API tests, and the AI + push tests inside the container with stand-ins - nothing is
# sent anywhere: the AI key is a placeholder).
name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed-screen-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a browser check for every changed app screen
        run: dev/tests/changed.sh --check-map

  quick:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a throwaway Kinetta
        run: |
          GEMINI_API_KEY=placeholder-for-tests KINETTA_PORT=8798 TZ=America/New_York docker compose -p kinettatest up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8798/api/health && break; sleep 3; done
      - name: Load the demo data
        env:
          KINETTA_URL: http://localhost:8798
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
      - name: Syntax, unit and quick API checks
        run: dev/tests/run.sh --quick
      - name: Check aggregate Features portal with fictional history (writes blocked)
        env:
          KINETTA_URL: http://localhost:8798
          KINETTA_PROJECT: kinettatest
          FEATURE_UI_SESSION: /tmp/kinetta-features-session.json
        run: |
          npm install --prefix /tmp/card-browser playwright
          /tmp/card-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 dev/tests/admin_features_fixture.py
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/admin_features_ui.cjs
          python3 dev/tests/feature_collection_fixture.py
          NODE_PATH=/tmp/card-browser/node_modules node dev/tests/feature_collection_ui.cjs
      - name: Server log (if something failed)
        if: failure()
        run: docker compose -p kinettatest logs app | tail -100
      - name: Stop it
        if: always()
        run: docker compose -p kinettatest down -v
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/dev/tests/journeys-compose.yml
      KINETTA_URL: http://localhost:8798
      KINETTA_PROJECT: kt-ci-backend
      KINETTA_PORT: 8798
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AI evaluation contracts (no paid model calls)
        run: python3 dev/evals/check.py
      - name: Start a throwaway Kinetta
        run: |
          GEMINI_API_KEY=placeholder-for-tests docker compose -p "$KINETTA_PROJECT" up -d --build
          for i in $(seq 1 60); do curl -sf "localhost:$KINETTA_PORT/api/health" && break; sleep 3; done
      - name: Load the demo data
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
      - name: Run the tests
        run: dev/tests/run.sh
      - name: Server log (if something failed)
        if: failure()
        run: docker compose -p "$KINETTA_PROJECT" logs app | tail -100
      - name: Stop it
        if: always()
        run: docker compose -p "$KINETTA_PROJECT" down -v

  browser_shards:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: browser shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/dev/tests/journeys-compose.yml
      KINETTA_URL: http://localhost:8798
      KINETTA_PROJECT: kt-ci-shard-${{ matrix.shard }}
      KINETTA_PORT: 8798
      KINETTA_JOURNEY_SHOTS: /tmp/kt-ci-shard-${{ matrix.shard }}-journey-shots
      FEATURE_UI_SESSION: /tmp/kt-ci-shard-${{ matrix.shard }}-features-session.json
      NODE_PATH: /tmp/kinetta-browser/node_modules
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start this shard's isolated Kinetta
        run: |
          GEMINI_API_KEY=placeholder-for-tests docker compose -p "$KINETTA_PROJECT" up -d --build
          for i in $(seq 1 60); do curl -sf "localhost:$KINETTA_PORT/api/health" && break; sleep 3; done
      - name: Load the demo data
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kinetta-browser playwright
          /tmp/kinetta-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run this browser shard
        run: bash dev/tests/run_browser_shard.sh "${{ matrix.shard }}"
      - name: Keep journey evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v4
        with:
          name: journeys-links-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            /tmp/kt-ci-shard-${{ matrix.shard }}-journeys-report.json
            /tmp/kt-ci-shard-${{ matrix.shard }}-journeys-dark-report.json
            /tmp/kt-ci-shard-${{ matrix.shard }}-links-report.json
            /tmp/kt-ci-shard-${{ matrix.shard }}-journey-shots
          if-no-files-found: ignore
      - name: Server log (if something failed)
        if: failure()
        run: docker compose -p "$KINETTA_PROJECT" logs app | tail -100
      - name: Stop this shard
        if: always()
        run: docker compose -p "$KINETTA_PROJECT" down -v

  tests:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [backend, browser_shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require backend and all browser shards to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_SHARDS_RESULT: ${{ needs.browser_shards.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$BROWSER_SHARDS_RESULT" = success

  spacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINETTA_URL: http://localhost:8798
      KINETTA_PROJECT: kinettatest
      KINETTA_PORT: 8798
      GEMINI_API_KEY: placeholder-for-tests
      TZ: America/New_York
      KINETTA_SPACING_REPORT: /tmp/spacing-report.json
      KINETTA_SPACING_SHOTS: /tmp/spacing-shots
      KINETTA_ACCESSIBILITY_OUTPUT: /tmp/accessibility-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a disposable copy
        run: |
          docker compose -p kinettatest up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8798/api/health && break; sleep 3; done
      - name: Load fictional screens
        run: |
          python3 dev/demo/gen_gpx.py /tmp/spacing-gpx 120
          python3 dev/demo/seed.py /tmp/spacing-gpx
          python3 dev/screenshots/stage.py /tmp/spacing-gpx
          python3 dev/tests/spacing_prepare.py
      - name: Install the browser
        run: |
          npm ci --prefix dev/tests/browser
          dev/tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the collector and every screen
        run: |
          node dev/tests/test_spacing_geometry.cjs
          NODE_PATH="$PWD/dev/tests/browser/node_modules" node dev/tests/test_spacing_dom.cjs
          NODE_PATH="$PWD/dev/tests/browser/node_modules" node dev/tests/spacing_audit.cjs
      - name: Check accessible names, semantics and contrast
        run: |
          NODE_PATH="$PWD/dev/tests/browser/node_modules" node dev/tests/test_ui_fixture_browser.cjs
          NODE_PATH="$PWD/dev/tests/browser/node_modules" node dev/tests/accessibility_audit.cjs
      - name: Keep fictional spacing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacing-evidence
          path: |
            /tmp/spacing-report.json
            /tmp/spacing-shots
            /tmp/accessibility-evidence
          if-no-files-found: ignore
      - name: Stop the disposable copy
        if: always()
        run: docker compose -p kinettatest down -v
