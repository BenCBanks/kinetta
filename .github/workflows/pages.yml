# Publishes the kinetta.app homepage (the site/ folder) with GitHub Pages whenever it changes on main.
name: Homepage
on:
  push:
    branches: [main]
    paths: ["site/**", "dev/design/build_content.py", "dev/design/build_guide.js", "app/static/explore.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Finish an active Pages deployment before publishing the next capture/release.
  # Cancelling its workflow can leave the Pages API still deploying underneath it.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build editable website copy
        run: python3 dev/design/build_content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
