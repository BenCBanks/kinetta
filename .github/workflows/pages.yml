# Publishes the kinetta.app homepage (the site/ folder) with GitHub Pages whenever it changes on main.
name: Homepage
on:
  push:
    branches: [main]
    paths: ["site/**", "dev/design/build_content.py", "app/static/explore.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Finish an active Pages deployment before publishing the next capture/release.
  # Cancelling its workflow can leave the Pages API still deploying underneath it.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build editable website copy
        run: python3 dev/design/build_content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the current Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq 'any(.artifacts[]; .name == "github-pages" and (.expired | not))' | grep -q '^true$'; then
              echo "The current Pages artifact is visible to the deployment API."
              exit 0
            fi
            echo "Waiting for the Pages artifact metadata ($attempt/10)."
            sleep 2
          done
          echo "The current Pages artifact did not become visible within 20 seconds." >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
