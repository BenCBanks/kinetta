# Retakes the homepage screenshots (site/assets/shots) from a throwaway copy of Kinetta with the made-up demo data, here
# on GitHub where the map tiles load, and commits them to the branch. Runs when the screenshot scripts change in a pull
# request, or by hand: Actions > Homepage screenshots > Run workflow (pick the branch).
name: Homepage screenshots
on:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths: ["app/static/**", "dev/demo/**", "dev/screenshots/**"]
  pull_request:
    paths: ["dev/screenshots/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    # a pull request from someone else's fork can't push here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Start a throwaway Kinetta
        # a placeholder AI key only makes the app show its AI cards; nothing is ever sent (the demo's reviews are made up
        # in coach.sql and no one presses the buttons). dev/screenshots/standin.py supplies the food chat's made-up estimates.
        run: |
          GEMINI_API_KEY=placeholder-for-screenshots KINETTA_PORT=8798 TZ=America/New_York docker compose -p shots -f docker-compose.yml -f dev/screenshots/compose.standin.yml up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8798/api/health && break; sleep 3; done
      - name: Load the demo data
        env:
          KINETTA_URL: http://localhost:8798
        run: |
          python3 dev/demo/gen_gpx.py /tmp/gpx 120
          python3 dev/demo/seed.py /tmp/gpx
          python3 dev/screenshots/stage.py /tmp/gpx
          docker compose -p shots exec -T db psql -U postgres -d fit < dev/screenshots/coach.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pin Python: the runner's default moved to 3.14, which the pinned Pillow has no wheel for (it then tried, and
      # failed, to compile it from source, so the screenshots stopped updating on 22 October).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the screenshots
        run: |
          mkdir -p /tmp/shots-tool /tmp/png && cd /tmp/shots-tool && npm init -y >/dev/null && npm install playwright@1.48.2
          npx playwright install --with-deps chromium
          NODE_PATH=/tmp/shots-tool/node_modules node "$GITHUB_WORKSPACE/dev/screenshots/take.js" /tmp/png
          NODE_PATH=/tmp/shots-tool/node_modules node "$GITHUB_WORKSPACE/dev/tests/map_ui.cjs"
          NODE_PATH=/tmp/shots-tool/node_modules node "$GITHUB_WORKSPACE/dev/tests/lift_ui.cjs"
          NODE_PATH=/tmp/shots-tool/node_modules node "$GITHUB_WORKSPACE/dev/tests/activity_ui.cjs"
          NODE_PATH=/tmp/shots-tool/node_modules node "$GITHUB_WORKSPACE/dev/tests/personal_notifications_ui.cjs"
          pip install pillow==11.0.0
          python3 "$GITHUB_WORKSPACE/dev/screenshots/to_webp.py" /tmp/png "$GITHUB_WORKSPACE/site/assets/shots"
      - name: Commit them
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/shots
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Homepage screenshots retaken (demo data) [skip ci]"
          # A website-only merge can advance the branch while the demo is rendering.
          # Rebase only this screenshot commit; never force-push over someone else's work.
          for attempt in 1 2 3; do
            git fetch origin "$PUBLISH_BRANCH"
            git rebase "origin/$PUBLISH_BRANCH"
            if git push origin "HEAD:$PUBLISH_BRANCH"; then exit 0; fi
          done
          echo "Screenshot publication lost three concurrent-update races." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: homepage-screenshots
          path: site/assets/shots
      - name: Publish refreshed homepage on main
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Stop it
        if: always()
        run: docker compose -p shots down -v
