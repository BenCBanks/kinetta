name: Admin UI
on:
  pull_request:
    paths: ["app/static/admin.js", "app/static/admin.html", "dev/tests/test_admin_logins.js", ".github/workflows/admin-ui.yml"]
  push:
    branches: [main]
    paths: ["app/static/admin.js", "app/static/admin.html", "dev/tests/test_admin_logins.js", ".github/workflows/admin-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign-in history with paginated account responses (no server or database)
        run: |
          node --check app/static/admin.js
          node dev/tests/test_admin_logins.js
