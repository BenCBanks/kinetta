name: Admin UI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ["app/static/admin.js", "app/static/admin.html", "app/static/admin-tools.js", "dev/tests/test_admin_logins.js", "dev/tests/test_admin_tools.js", "dev/tests/test_temporary_login.js", "app/static/native.js", ".github/workflows/admin-ui.yml"]
  push:
    branches: [main]
    paths: ["app/static/admin.js", "app/static/admin.html", "app/static/admin-tools.js", "dev/tests/test_admin_logins.js", "dev/tests/test_admin_tools.js", "dev/tests/test_temporary_login.js", "app/static/native.js", ".github/workflows/admin-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign-in history with paginated account responses (no server or database)
        run: |
          node --check app/static/admin.js
          node dev/tests/test_admin_logins.js
          node dev/tests/test_admin_tools.js
          node dev/tests/test_temporary_login.js
          node --check app/static/admin-tools.js
