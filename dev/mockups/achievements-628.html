<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Kinetta Achievements · design directions</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f5f7;
      --surface: #fff;
      --soft: #edf0f3;
      --text: #15191d;
      --secondary: #4a535c;
      --muted: #646d77;
      --divider: #e3e7eb;
      --brand: #1f55d0;
      --brand-soft: #e6eefd;
      --action: #2563eb;
      --achievement: #8a5f10;
      --run: #12924f;
      --ride: #0b8798;
      --hike: #b26a10;
      --radius-card: 18px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0e1113;
      --surface: #171b1f;
      --soft: #20262b;
      --text: #f1f3f5;
      --secondary: #b4bcc4;
      --muted: #929ba4;
      --divider: #2a3137;
      --brand: #82aaf6;
      --brand-soft: #18243a;
      --action: #2f64d8;
      --achievement: #f2c14e;
      --run: #4cc98a;
      --ride: #4bc0cf;
      --hike: #e9a04e;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: var(--canvas); color: var(--text); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
    button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    a { text-decoration: none; }
    .app { width: 100%; max-width: 430px; height: 100dvh; min-height: 720px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--canvas); }
    .statusbar { height: 58px; flex: 0 0 58px; padding: 12px 25px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 15px; font-weight: 650; letter-spacing: -.15px; }
    .status-time { justify-self: start; padding-left: 4px; }
    .island { width: 124px; height: 34px; border-radius: 20px; background: #050505; }
    .status-icons { justify-self: end; display: flex; gap: 5px; align-items: center; height: 20px; }
    .status-icons svg { width: 18px; height: 16px; fill: currentColor; }
    .battery { width: 23px; height: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 2px; position: relative; }
    .battery::before { content: ""; display: block; width: 72%; height: 100%; border-radius: 1px; background: currentColor; }
    .battery::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; opacity: .6; }
    .screen { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 0 22px 18px; }
    .screen::-webkit-scrollbar { display: none; }
    .toolbar { min-height: 44px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .toolbar h1 { min-width: 0; margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.35px; }
    .toolbar-actions { display: flex; align-items: center; gap: 4px; }
    .icon-button { width: 44px; height: 44px; border: 0; padding: 0; display: grid; place-items: center; background: transparent; color: var(--secondary); }
    .icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .identity { display: grid; grid-template-columns: 56px minmax(0,1fr) 44px; align-items: center; gap: 12px; margin-bottom: 8px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: #5670a8; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
    .identity h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 700; letter-spacing: -.25px; }
    .identity p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .bio { margin: 0 0 14px 68px; color: var(--secondary); font-size: 14px; }
    .card { border: 1px solid var(--divider); border-radius: var(--radius-card); background: var(--surface); }
    .summary-card { padding: 14px 15px 12px; margin: 0 0 18px; }
    .summary-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .summary-title h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .summary-title small { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
    .metric { min-width: 0; display: grid; gap: 3px; }
    .metric b { min-width: 0; font-size: 17px; line-height: 1.2; font-weight: 700; letter-spacing: -.2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .metric b small { font-size: 11px; font-weight: 600; color: var(--muted); }
    .metric span { color: var(--muted); font-size: 12px; }
    .chart { display: flex; align-items: end; gap: 8px; height: 32px; margin-top: 12px; padding: 0 1px; }
    .chart i { flex: 1; min-width: 0; border-radius: 4px 4px 0 0; background: var(--brand-soft); }
    .chart i.current { background: var(--action); }
    .section-heading { min-height: 44px; margin: -2px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .section-heading h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 700; letter-spacing: -.25px; }
    .section-heading a { min-height: 44px; display: inline-flex; align-items: center; gap: 3px; }
    .chevron { color: var(--muted); font-size: 26px; line-height: 1; font-weight: 400; }
    .achievements { margin-bottom: 14px; }
    .medallions { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px; }
    .medallion-link { min-width: 0; min-height: 106px; padding: 0 2px 4px; display: grid; justify-items: center; align-content: start; gap: 4px; border-radius: 14px; text-align: center; }
    .medallion-link:active, .quiet-link:active { background: var(--soft); }
    .medallion { --track: var(--brand); width: 68px; height: 68px; position: relative; display: grid; place-items: center; border-radius: 50%; color: var(--track); background: color-mix(in srgb,var(--track) 12%,var(--surface)); }
    .medallion svg { position: absolute; inset: 0; width: 68px; height: 68px; transform: rotate(-90deg); overflow: visible; }
    .medallion circle { fill: none; stroke-width: 2.4; }
    .medallion .ring-base { stroke: color-mix(in srgb, var(--track) 18%, transparent); }
    .medallion .ring-progress { stroke: var(--track); stroke-linecap: round; stroke-dasharray: 151; stroke-dashoffset: var(--offset, 61); }
    .medallion-icon { z-index: 1; display: grid; place-items: center; }
    .medallion-icon svg, .track-chip svg, .tier-seal svg, .mini-icon svg, .award svg, .sport-icon svg, .explore-tile strong i svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .medallion-icon svg { position: static; inset: auto; width: 28px; height: 28px; transform: none; overflow: visible; }
    .medallion-link b { max-width: 100%; font-size: 13px; line-height: 1.15; font-weight: 650; overflow-wrap: anywhere; }
    .medallion-link small { color: var(--secondary); font-size: 12px; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .journey-card { padding: 14px 16px 13px; margin-bottom: 11px; }
    .journey-label { color: var(--secondary); font-size: 13px; font-weight: 650; }
    .journey-distance { margin-top: 2px; font-size: 34px; line-height: 1.1; font-weight: 750; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .journey-next { margin-top: 4px; color: var(--secondary); font-size: 14px; }
    .route { display: block; width: 100%; height: 51px; margin: 8px 0 1px; overflow: visible; }
    .route line, .route path { stroke: var(--divider); stroke-width: 3; stroke-linecap: round; }
    .route .done { stroke: var(--ride); }
    .route circle { fill: var(--surface); stroke: var(--ride); stroke-width: 3; }
    .route circle.passed { fill: var(--ride); }
    .route circle.next { fill: var(--surface); stroke: var(--achievement); }
    .route-labels { display: flex; justify-content: space-between; gap: 6px; margin-top: -6px; color: var(--muted); font-size: 11px; }
    .track-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .track-chip { min-height: 34px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 18px; background: var(--soft); color: var(--text); font-size: 13px; font-weight: 500; }
    .track-chip i { display: grid; place-items: center; color: var(--track); font-style: normal; }
    .track-chip svg { width: 17px; height: 17px; }
    .shelf { display: grid; grid-template-columns: 1fr 1.05fr 1.2fr; gap: 6px; align-items: end; padding: 0 2px 4px; }
    .tier { min-width: 0; min-height: 105px; display: grid; grid-template-rows: 58px auto auto; justify-items: center; align-content: end; gap: 3px; text-align: center; }
    .tier.latest { grid-template-rows: 74px auto auto; }
    .tier-seal { width: 48px; height: 48px; display: grid; place-items: center; align-self: end; border-radius: 50%; color: var(--tier-color); background: color-mix(in srgb, var(--tier-color) 15%, var(--surface)); }
    .tier-seal svg { width: 23px; height: 23px; }
    .tier:nth-child(2) .tier-seal { width: 56px; height: 56px; }
    .tier.latest .tier-seal { width: 70px; height: 70px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tier-color) 40%, transparent); }
    .tier b { width: 100%; color: var(--text); font-size: 12px; line-height: 1.15; font-weight: 650; overflow-wrap: anywhere; }
    .tier time { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .next-teaser { margin: 8px 0 0; color: var(--secondary); font-size: 13px; }
    .activity-section { margin-top: 6px; }
    .activity-section .section-heading { margin-bottom: 3px; }
    .activity-row { min-height: 78px; padding: 12px 0; border-top: 1px solid var(--divider); display: grid; grid-template-columns: 38px minmax(0,1fr) 20px; gap: 10px; align-items: center; }
    .sport-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--run) 13%, var(--surface)); color: var(--run); }
    .sport-icon svg { width: 21px; height: 21px; }
    .activity-copy { min-width: 0; }
    .activity-copy b { display: block; font-size: 15px; font-weight: 650; }
    .activity-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .activity-arrow { color: var(--muted); font-size: 23px; }
    .compact-heading { min-height: 44px; margin: -2px 0 4px; display: flex; justify-content: space-between; align-items: center; }
    .compact-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .compact-row { min-height: 75px; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px; align-items: center; }
    .compact-medallion { min-width: 0; min-height: 62px; display: flex; justify-content: center; align-items: center; gap: 7px; border-radius: 12px; }
    .compact-medallion .mini-icon { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb,var(--track) 12%,var(--surface)); color: var(--track); }
    .mini-icon svg { width: 21px; height: 21px; }
    .compact-medallion b { min-width: 0; font-size: 12px; line-height: 1.15; font-weight: 650; overflow-wrap: anywhere; }
    .progress-total { padding: 13px 15px 11px; margin-bottom: 12px; }
    .progress-total h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .total-row b { font-size: 24px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .total-row small { color: var(--muted); font-size: 12px; }
    .periods { min-height: 36px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .periods strong { color: var(--brand); font-weight: 650; }
    .progress-bars { height: 48px; padding: 1px 4px 0; display: flex; align-items: end; gap: 7px; border-bottom: 1px solid var(--divider); }
    .progress-bars i { flex: 1; border-radius: 4px 4px 0 0; background: var(--brand-soft); }
    .progress-bars i.current { background: var(--action); }
    .progress-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 17px; }
    .progress-summary { min-height: 76px; padding: 12px 11px; }
    .progress-summary b { display: block; font-size: 15px; font-weight: 650; }
    .progress-summary span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .explore-heading { margin: 0 0 8px; font-size: 18px; font-weight: 700; letter-spacing: -.25px; }
    .explore-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
    .explore-tile { min-height: 91px; padding: 12px; border: 1px solid var(--divider); border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; background: var(--surface); }
    .explore-tile strong { display: flex; align-items: center; gap: 7px; font-size: 14px; line-height: 1.2; font-weight: 650; }
    .explore-tile strong i { display: grid; place-items: center; color: var(--achievement); font-style: normal; }
    .explore-tile strong i svg { width: 19px; height: 19px; }
    .explore-tile small { color: var(--muted); font-size: 12px; }
    .me-card { overflow: hidden; margin-bottom: 17px; border: 1px solid var(--divider); border-radius: 20px; background: var(--surface); }
    .me-banner { height: 32px; background: linear-gradient(115deg,#c7d8ee,#e4edf7 68%,#d6e7eb); }
    [data-theme="dark"] .me-banner { background: linear-gradient(115deg,#263c56,#263942 68%,#20363a); }
    .me-id { padding: 14px 15px 10px; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; }
    .me-id .avatar { width: 48px; height: 48px; font-size: 15px; }
    .me-id h2 { margin: 0; font-size: 17px; line-height: 1.2; }
    .me-id p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .me-friends { color: var(--brand); font-size: 12px; font-weight: 600; }
    .me-week { padding: 10px 15px 13px; border-top: 1px solid var(--divider); }
    .me-week-head { margin-bottom: 10px; color: var(--secondary); font-size: 13px; font-weight: 650; }
    .me-numbers { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px; }
    .me-numbers b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .me-numbers span { color: var(--muted); font-size: 11px; }
    .me-chart { height: 29px; margin-top: 10px; display: flex; align-items: end; gap: 7px; }
    .me-chart i { flex: 1; border-radius: 4px 4px 0 0; background: var(--brand-soft); }
    .me-chart i.current { background: var(--action); }
    .today-section { margin-top: 1px; }
    .today-section h2 { margin: 0 0 4px; min-height: 36px; display: flex; align-items: center; font-size: 18px; }
    .quiet-link { width: 100%; min-height: 52px; padding: 4px 0; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); display: grid; grid-template-columns: 30px minmax(0,1fr) auto 18px; gap: 8px; align-items: center; }
    .quiet-link .award { color: var(--achievement); font-size: 20px; text-align: center; }
    .quiet-link .award svg { width: 20px; height: 20px; vertical-align: middle; }
    .quiet-link b { min-width: 0; font-size: 14px; font-weight: 600; }
    .quiet-link time { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .tabbar { flex: 0 0 80px; height: 80px; padding: 7px 7px 20px; display: grid; grid-template-columns: repeat(5,1fr); align-items: center; border-top: 1px solid var(--divider); background: var(--surface); }
    .tab { min-width: 0; min-height: 48px; position: relative; display: grid; grid-template-rows: 23px 16px; align-content: center; justify-items: center; gap: 1px; color: var(--muted); font-size: 10px; line-height: 1; text-decoration: none; }
    .tab svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { color: var(--brand); font-weight: 650; }
    .tab.active::before { content: ""; position: absolute; top: -7px; width: 18px; height: 2px; border-radius: 2px; background: var(--brand); }
    @media (max-width: 370px) {
      .screen { padding-inline: 16px; }
      .statusbar { padding-inline: 21px; }
      .metric b { font-size: 16px; }
      .medallion { width: 62px; height: 62px; }
      .medallion svg { width: 62px; height: 62px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    const path = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
    const icons = {
      share: path('<path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
      more: path('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
      today: path('<path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"/>'),
      activity: path('<path d="M3 12h4l3-8 4 16 3-8h4"/>'),
      progress: path('<path d="M4 19V5m0 14h17M8 16v-4m4 4V8m4 8v-6m4 6V4"/>'),
      nutrition: path('<path d="M6 3v6m4-6v6M8 9v12M17 3c-2 2-3 5-3 8h3v9"/>'),
      me: path('<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>'),
      globe: path('<circle cx="12" cy="12" r="8.7"/><path d="M3.6 12h16.8M12 3.3c2.4 2.3 3.7 5.2 3.7 8.7s-1.3 6.4-3.7 8.7c-2.4-2.3-3.7-5.2-3.7-8.7s1.3-6.4 3.7-8.7Z"/>'),
      mountain: path('<path d="m3 19 6.5-12 3.6 6.2 2-3.5L21 19H3Z"/><path d="m7.7 10.3 2.4 2.2M16 12.4l1.4 1.5"/>'),
      runner: path('<circle cx="15.5" cy="4.5" r="2"/><path d="m13 8 3.4 2.2 3 .2M13 8l-2.2 4.2 3.7 2.1 2 4.7M11 12.2l-4.7 1.2-2.8 3M14.5 14.3l-4.4 1.2-2.1 4.1"/>'),
      ride: path('<circle cx="6" cy="17" r="3.3"/><circle cx="18" cy="17" r="3.3"/><path d="m6 17 4.4-7h4.1l3.5 7H6Zm4.4-7-2-3h-2m6.2 3 2.4-3H17"/>'),
      award: path('<path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v2a4 4 0 0 0 4 4m7-6h3v2a4 4 0 0 1-4 4m-3 1v4m-4 3h8m-6-3h4l2 3H8l2-3Z"/>')
    };
    const tabs = (active) => `<nav class="tabbar" aria-label="Main navigation">
      ${[['Today','today'],['Activity','activity'],['Progress','progress'],['Nutrition','nutrition'],['Me','me']].map(([label,icon]) => `<a class="tab${label===active?' active':''}" href="#" aria-current="${label===active?'page':'false'}">${icons[icon]}<span>${label}</span></a>`).join('')}
    </nav>`;
    const status = `<div class="statusbar" aria-hidden="true"><span class="status-time">9:41</span><span class="island"></span><span class="status-icons"><svg viewBox="0 0 20 16"><path d="M1 5.1C6.3.5 13.7.5 19 5.1l-1.8 2C13 3.5 7 3.5 2.8 7.1L1 5.1Zm3 3.4c3.4-3 8.6-3 12 0l-1.8 2c-2.4-2-6-2-8.4 0L4 8.5Zm3 3.2c1.7-1.4 4.3-1.4 6 0l-3 3.3-3-3.3Z"/></svg><span class="battery"></span></span></div>`;
    const toolbar = (title, actions=true) => `<header class="toolbar"><h1>${title}</h1>${actions?`<div class="toolbar-actions"><button class="icon-button" aria-label="Share">${icons.share}</button><button class="icon-button" aria-label="More">${icons.more}</button></div>`:''}</header>`;
    const summary = `<section class="summary-card card" aria-label="Activity summary for the last 30 days">
      <div class="summary-title"><h2>Last 30 days</h2><small>Oct 7 – Nov 5</small></div>
      <div class="metrics"><div class="metric"><b>8</b><span>Workouts</span></div><div class="metric"><b>42.8 <small>mi</small></b><span>Distance</span></div><div class="metric"><b>6h 20m</b><span>Time</span></div></div>
      <div class="chart" role="img" aria-label="Weekly activity, fictional data"><i style="height:42%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i class="current" style="height:66%"></i></div>
    </section>`;
    const profileIntro = `<section class="identity"><span class="avatar" aria-hidden="true">AR</span><div><h2>Alex Rivera</h2><p>@alexrivera · 48 friends</p></div><button class="icon-button" aria-label="More profile options">${icons.more}</button></section><p class="bio">Weekend runs, neighborhood rides, and a trail now and then.</p>`;
    const medal = (glyph, color, offset, title, value) => `<a class="medallion-link" href="#" aria-label="${title}, ${value}"><span class="medallion" style="--track:${color};--offset:${offset}"><svg viewBox="0 0 68 68" aria-hidden="true"><circle class="ring-base" cx="34" cy="34" r="24"></circle><circle class="ring-progress" cx="34" cy="34" r="24"></circle></svg><span class="medallion-icon">${glyph}</span></span><b>${title}</b><small>${value}</small></a>`;
    const largeMedallions = `<div class="medallions">
      ${medal(icons.globe,'var(--brand)','58','Journey','3,790 mi')}
      ${medal(icons.mountain,'var(--achievement)','90','Climbing','3 Everests')}
      ${medal(icons.runner,'var(--run)','74','Run','62.2 mi')}
    </div>`;
    const achievementsHeading = `<div class="section-heading"><a href="#"><h2>Achievements</h2><span class="chevron" aria-hidden="true">›</span></a></div>`;
    const directionA = `<section class="achievements">${achievementsHeading}${largeMedallions}</section>`;
    const directionB = `<section class="achievements">${achievementsHeading}
      <div class="journey-card card">
        <div class="journey-label">Journey</div><div class="journey-distance">3,790 mi</div><div class="journey-next">Next: Length of Africa</div>
        <svg class="route" viewBox="0 0 330 51" preserveAspectRatio="none" role="img" aria-label="Route to the next Journey landmark"><line x1="8" y1="24" x2="322" y2="24"></line><path class="done" d="M8 24H211"></path><circle class="passed" cx="8" cy="24" r="5"></circle><circle class="passed" cx="97" cy="24" r="5"></circle><circle class="passed" cx="211" cy="24" r="5"></circle><circle class="next" cx="322" cy="24" r="6"></circle></svg>
        <div class="route-labels"><span>Marathon</span><span>UK</span><span>Across US</span><span>Africa</span></div>
      </div>
      <div class="track-chips"><span class="track-chip"><i style="--track:var(--hike)">${icons.mountain}</i>Climbing · 3 Everests</span><span class="track-chip"><i style="--track:var(--run)">${icons.runner}</i>Run · 62.2 mi</span></div>
    </section>`;
    const directionC = `<section class="achievements">${achievementsHeading}
      <div class="shelf" aria-label="Earned tiers in date order">
        <div class="tier" style="--tier-color:var(--brand)"><span class="tier-seal">${icons.globe}</span><b>Marathon</b><time datetime="2026-09-12">Sep 12</time></div>
        <div class="tier" style="--tier-color:var(--ride)"><span class="tier-seal">${icons.globe}</span><b>Lake Tahoe loop</b><time datetime="2026-10-07">Oct 7</time></div>
        <div class="tier latest" style="--tier-color:var(--achievement)"><span class="tier-seal">${icons.globe}</span><b>Across the US</b><time datetime="2026-11-02">Nov 2</time></div>
      </div><p class="next-teaser">Next · Length of Africa</p>
    </section>`;
    const compactMedallions = `<section class="achievements compact-achievements"><div class="compact-heading"><h2>Achievements</h2><span class="chevron" aria-hidden="true">›</span></div>
      <div class="compact-row"><a class="compact-medallion" href="#" style="--track:var(--brand)"><span class="mini-icon">${icons.globe}</span><b>Journey</b></a><a class="compact-medallion" href="#" style="--track:var(--achievement)"><span class="mini-icon">${icons.mountain}</span><b>Climbing</b></a><a class="compact-medallion" href="#" style="--track:var(--run)"><span class="mini-icon">${icons.runner}</span><b>Run</b></a></div>
    </section>`;
    const activityList = `<section class="activity-section"><div class="section-heading"><h2>Activities</h2><span class="chevron" aria-hidden="true">›</span></div>
      <a class="activity-row" href="#"><span class="sport-icon">${icons.runner}</span><span class="activity-copy"><b>Easy morning run</b><span>Today · 4.2 mi · 38 min</span></span><span class="activity-arrow">›</span></a>
      <a class="activity-row" href="#"><span class="sport-icon" style="color:var(--ride);background:color-mix(in srgb,var(--ride) 13%,var(--surface))">${icons.ride}</span><span class="activity-copy"><b>Creek greenway ride</b><span>Nov 3 · 18.6 mi · 1h 12m</span></span><span class="activity-arrow">›</span></a>
    </section>`;
    const profileScreen = (achievements, {title='Profile', includeActivities=true}={}) => `${status}<main class="screen">${toolbar(title)}${profileIntro}${summary}${achievements}${includeActivities?activityList:''}</main>${tabs('Me')}`;
    const profileForDirection = (direction) => profileScreen(direction==='B'?directionB:direction==='C'?directionC:directionA);
    const placementProfile = () => profileScreen(compactMedallions);
    const progressScreen = () => `${status}<main class="screen">${toolbar('Progress',false)}
      <section class="progress-total card"><h2>Totals</h2><div class="total-row"><b>36.2 mi</b><small>This week</small></div><div class="periods"><strong>Week</strong><span>Month</span><span>Year</span></div><div class="progress-bars" aria-label="Weekly distance chart"><i style="height:38%"></i><i style="height:57%"></i><i style="height:48%"></i><i style="height:82%"></i><i class="current" style="height:65%"></i><i style="height:40%"></i><i style="height:12%"></i></div></section>
      <div class="progress-pair"><a class="progress-summary card" href="#"><b>Fitness</b><span>Training steadily</span></a><a class="progress-summary card" href="#"><b>Records</b><span>5K · 23:48</span></a></div>
      <h2 class="explore-heading">Explore your progress</h2><div class="explore-grid">
        <a class="explore-tile" href="#"><strong><i aria-hidden="true">${icons.award}</i>Achievements <span class="chevron">›</span></strong><small>3 tracks started · 4 tiers</small></a>
        <a class="explore-tile" href="#"><strong>Heatmap <span class="chevron">›</span></strong><small>Routes you've recorded</small></a>
        <a class="explore-tile" href="#"><strong>Training plan <span class="chevron">›</span></strong><small>Build a 5K plan</small></a>
        <a class="explore-tile" href="#"><strong>Calendar <span class="chevron">›</span></strong><small>See each training day</small></a>
      </div></main>${tabs('Progress')}`;
    const meScreen = () => `${status}<main class="screen">${toolbar('Hi, Alex',false)}
      <section class="me-card" aria-label="Alex's profile card"><div class="me-banner"></div><div class="me-id"><span class="avatar">AR</span><div><h2>Alex Rivera</h2><p>@alexrivera · 48 friends</p></div><span class="me-friends">Edit</span></div><div class="me-week"><div class="me-week-head">This week</div><div class="me-numbers"><div><b>36.2 mi</b><span>Distance</span></div><div><b>8</b><span>Workouts</span></div><div><b>6h 20m</b><span>Time</span></div></div><div class="me-chart" aria-label="Weekly distance chart"><i style="height:40%"></i><i style="height:72%"></i><i style="height:52%"></i><i style="height:88%"></i><i class="current" style="height:66%"></i><i style="height:32%"></i></div></div></section>
      <section class="today-section"><h2>Today</h2><a class="quiet-link" href="#"><span class="award">${icons.award}</span><b>Journey · Across the US</b><time datetime="2026-11-02">Nov 2</time><span class="activity-arrow">›</span></a></section>
      <section class="activity-section"><div class="section-heading"><h2>Recent activity</h2></div><a class="activity-row" href="#"><span class="sport-icon">${icons.runner}</span><span class="activity-copy"><b>Easy morning run</b><span>Today · 4.2 mi · 38 min</span></span><span class="activity-arrow">›</span></a></section>
    </main>${tabs('Me')}`;
    const mode = params.get('mode') || 'direction';
    let markup;
    if (mode === 'placement-profile') markup = placementProfile();
    else if (mode === 'placement-progress') markup = progressScreen();
    else if (mode === 'placement-me') markup = meScreen();
    else markup = profileForDirection((params.get('direction') || 'A').toUpperCase());
    document.querySelector('#app').innerHTML = markup;
    document.body.dataset.theme = theme;
  </script>
</body>
</html>
