# Kinetta - start it with:   docker compose up -d
# then open http://<this computer's address>:8790 and create your account (the first account is the admin).
# Settings are optional: copy .env.example to .env and edit it.
name: kinetta

x-image: &image
  image: ghcr.io/bencbanks/kinetta:${KINETTA_VERSION:-latest}
  build: .

services:
  # makes up the database passwords on the very first start and keeps them in the "secrets" volume
  firstrun:
    <<: *image
    command: ["python", "-m", "app.firstrun"]
    volumes:
      - secrets:/run/kinetta
    restart: "no"

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: fit
      POSTGRES_PASSWORD_FILE: /run/kinetta/db_password
      TZ: ${TZ:-UTC}
    volumes:
      - db:/var/lib/postgresql/data
      - secrets:/run/kinetta:ro
    depends_on:
      firstrun:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fit"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    <<: *image
    ports:
      - "${KINETTA_PORT:-8790}:8000"
    environment:
      KINETTA_MAP_TILES: ${KINETTA_MAP_TILES:-}
      KINETTA_MAP_KIND: ${KINETTA_MAP_KIND:-}
      KINETTA_MAP_DARK_TILES: ${KINETTA_MAP_DARK_TILES:-}
      KINETTA_MAP_ATTRIBUTION: ${KINETTA_MAP_ATTRIBUTION:-}
      KINETTA_MAP_ATTRIBUTION_URL: ${KINETTA_MAP_ATTRIBUTION_URL:-}
      KINETTA_MAP_MAX_ZOOM: ${KINETTA_MAP_MAX_ZOOM:-19}
      KINETTA_ROUTING_URL: ${KINETTA_ROUTING_URL:-https://valhalla1.openstreetmap.de}
      KINETTA_ELEVATION_URL: ${KINETTA_ELEVATION_URL:-}
      KINETTA_GEOCODER_URL: ${KINETTA_GEOCODER_URL:-https://nominatim.openstreetmap.org}
      FIT_DB_HOST: db
      FIT_APP_PASSWORD_FILE: /run/kinetta/app_password
      KINETTA_ADMIN_KEY_FILE: /run/kinetta/admin_key
      KINETTA_ADMIN_MFA: ${KINETTA_ADMIN_MFA:-on}
      KINETTA_RESEND_KEY: ${KINETTA_RESEND_KEY:-}
      KINETTA_MAIL_FROM: ${KINETTA_MAIL_FROM:-}
      KINETTA_MAIL_REPLY_TO: ${KINETTA_MAIL_REPLY_TO:-}
      KINETTA_MAIL_WEBHOOK_SECRET: ${KINETTA_MAIL_WEBHOOK_SECRET:-}
      KINETTA_TESTFLIGHT_URL: ${KINETTA_TESTFLIGHT_URL:-}
      KINETTA_SIGNUP: ${KINETTA_SIGNUP:-invite}            # invite | waitlist | open (open needs email set up)
      KINETTA_MAX_ACCOUNTS: ${KINETTA_MAX_ACCOUNTS:-}      # with open signup: the waitlist takes over at this many accounts
      POSTGRES_PASSWORD_FILE: /run/kinetta/db_password
      TZ: ${TZ:-UTC}
      KINETTA_APNS_TEAM_ID: ${KINETTA_APNS_TEAM_ID:-}
      KINETTA_APNS_KEY_ID: ${KINETTA_APNS_KEY_ID:-}
      KINETTA_APNS_TOPIC: ${KINETTA_APNS_TOPIC:-com.kinetta.app}
      KINETTA_APNS_PRIVATE_KEY: ${KINETTA_APNS_PRIVATE_KEY:-}
      KINETTA_AI_ENABLED: ${KINETTA_AI_ENABLED:-1}
      KINETTA_AI_DAILY_USD: ${KINETTA_AI_DAILY_USD:-}
      KINETTA_AI_USER_DAILY_MICROUSD: ${KINETTA_AI_USER_DAILY_MICROUSD:-}
      KINETTA_AI_CONCURRENT: ${KINETTA_AI_CONCURRENT:-8}
      KINETTA_AI_USER_CONCURRENT: ${KINETTA_AI_USER_CONCURRENT:-2}
      KINETTA_AI_DAILY_ATTEMPTS: ${KINETTA_AI_DAILY_ATTEMPTS:-2000}
      KINETTA_AI_USER_DAILY_ATTEMPTS: ${KINETTA_AI_USER_DAILY_ATTEMPTS:-120}
      KINETTA_FOOD_AI_DAILY_USD: ${KINETTA_FOOD_AI_DAILY_USD:-5}
      KINETTA_AI_ACCESS_MODE: ${KINETTA_AI_ACCESS_MODE:-open}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FDC_API_KEY: ${FDC_API_KEY:-}
      # Garmin Connect developer program keys (garmin_connect.py); without them the Garmin Connect card stays hidden
      GARMIN_CLIENT_ID: ${GARMIN_CLIENT_ID:-}
      GARMIN_CLIENT_SECRET: ${GARMIN_CLIENT_SECRET:-}
      GARMIN_CONNECT_OPEN: ${GARMIN_CONNECT_OPEN:-}   # 1 = everyone may connect; otherwise only the admin
      GARMIN_PUSH_SECRET: ${GARMIN_PUSH_SECRET:-}     # push mode: the secret end of the address set in Garmin's portal
      KINETTA_PUBLIC_URL: ${KINETTA_PUBLIC_URL:-}
      KINETTA_BETA_SIGNUP: ${KINETTA_BETA_SIGNUP:-}
      # who to believe about a visitor's address (login-guessing limits)
      KINETTA_TRUST_CLOUDFLARE: ${KINETTA_TRUST_CLOUDFLARE:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - data:/data
      - secrets:/run/kinetta:ro
    networks:
      - default
      - public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:   # access logs hold visitors' IP addresses: keep them short
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Optional: a public https address through Cloudflare, without opening your router.
  # Start with:  docker compose --profile tunnel up -d
  # It sits on its own network with only the app, so it can't reach the database.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - public
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    profiles: ["tunnel"]
    restart: unless-stopped

networks:
  default:
  public:     # the app + the optional tunnel only

volumes:
  db:
  data:
  secrets:
